name: Pin It group areas release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-group-areas.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Pin It 1.6.0 group areas
        run: python3 .github/scripts/release_group_areas_runner.py

      - name: Second pass checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'const VERSION = "1.6.0";' index.html
          grep -q 'function groupBounds(g)' index.html
          grep -q 'function createGroupArea(ids)' index.html
          grep -q 'data-s="group"' index.html
          grep -q 'groups: board.groups' index.html
          grep -q '## Group areas' README.md
          grep -q '## 1.6.0 — 14 September 2026, 23:15 UTC' CHANGELOG.md
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, script in enumerate(scripts):
                  p = Path(td) / f's{i}.js'
                  p.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
          assert html.count('version: "1.6.0"') == 1
          assert html.count('const VERSION = "1.6.0";') == 1
          assert html.count('const BUILD = "14 September 2026, 23:15 UTC";') == 1
          assert html.count('function groupBounds(g)') == 1
          assert html.count('function createGroupArea(ids)') == 1
          assert html.count('n.className = "group-box"') == 1
          print(f'Second pass: {len(scripts)} inline scripts parse and group-area wiring is singular.')
          PY

      - name: Commit release to main
        shell: bash
        run: |
          rm -f .github/workflows/release-group-areas.yml .github/scripts/release_group_areas.py .github/scripts/release_group_areas_runner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Pin It 1.6.0 group areas"
          git push origin HEAD:main
