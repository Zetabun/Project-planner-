name: Release Pin It 1.8.1 mobile board label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-mobile-board-label-181.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pin It 1.8.1
        run: python .github/scripts/release_mobile_board_label_181.py

      - name: Second pass checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'const VERSION = "1.8.1";' index.html
          grep -F 'const BUILD = "15 September 2026, 11:21 UTC";' index.html
          grep -F 'version: "1.8.1", date: "15 September 2026, 11:21 UTC"' index.html
          grep -F '#caseplate{max-width:38vw; font-size:12.5px; padding:5px 10px 7px; margin-left:10px}' index.html
          grep -F '## 1.8.1 — 15 September 2026, 11:21 UTC' CHANGELOG.md

      - name: Commit release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md
          git rm .github/scripts/release_mobile_board_label_181.py .github/workflows/release-mobile-board-label-181.yml
          git commit -m 'Release Pin It 1.8.1 mobile board label spacing'
          git push origin HEAD:main
