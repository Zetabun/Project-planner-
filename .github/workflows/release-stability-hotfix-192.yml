name: Release Pin It 1.9.2 stability hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stability-hotfix-192.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stability hotfix
        run: python .github/scripts/release_stability_hotfix_192.py

      - name: Second pass checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'const VERSION = "1.9.2";' index.html
          grep -F 'const BUILD = "15 September 2026, 13:34 UTC";' index.html
          grep -F 'version: "1.9.2", date: "15 September 2026, 13:34 UTC"' index.html
          grep -F 'let storageWriteBlocked = false;' index.html
          grep -F 'if (storageWriteBlocked) { flashSaved("not saved — storage full"); return; }' index.html
          grep -F 'const candidate = Object.assign({}, DB, { boards: DB.boards.concat(staged) });' index.html
          grep -F 'if (!store.set(KEY, payload))' index.html
          grep -F 'const undoMediaByValue = new Map(), undoMediaByKey = new Map();' index.html
          grep -F '#idea-drawer.opening .idea-card:nth-child(-n+8)' index.html
          grep -F '## 1.9.2 — 15 September 2026, 13:34 UTC' CHANGELOG.md

      - name: Commit release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md
          git rm .github/scripts/release_stability_hotfix_192.py .github/workflows/release-stability-hotfix-192.yml
          git commit -m 'Release Pin It 1.9.2 stability hotfix'
          git push origin HEAD:main
