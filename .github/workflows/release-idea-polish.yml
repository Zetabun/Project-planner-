name: Pin It idea workflow polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-idea-polish.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and verify Pin It 1.5.1
        run: python3 .github/scripts/release_idea_polish.py

      - name: Second pass checks
        shell: bash
        run: |
          git diff --check
          grep -q 'const VERSION = "1.5.1";' index.html
          grep -q 'touch-action:pan-y' index.html
          grep -q 'max-height:calc(100vh - 16px)' index.html
          grep -q 'tag: "Evidence tag"' index.html
          grep -q 'Photos stay on the board' index.html
          grep -q '## 1.5.1 — 14 September 2026, 22:45 UTC' CHANGELOG.md
          echo "Second pass: mobile drawer, relationship menu, data safety, terminology and release metadata verified."

      - name: Commit release to main
        shell: bash
        run: |
          rm -f .github/workflows/release-idea-polish.yml .github/scripts/release_idea_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Pin It 1.5.1 idea workflow polish"
          git push origin HEAD:main
