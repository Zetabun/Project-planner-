name: Release Pin It 1.8.0 system workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-system-workflow-18.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pin It 1.8.0
        run: python .github/scripts/release_system_workflow_18.py

      - name: Second pass checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'const VERSION = "1.8.0";' index.html
          grep -F 'version: "1.8.0", date: "15 September 2026, 10:49 UTC"' index.html
          grep -F 'Edit contents' index.html README.md CHANGELOG.md
          grep -F 'Move system + contents' index.html README.md CHANGELOG.md
          grep -F 'Collapse system' index.html README.md CHANGELOG.md
          grep -F 'DB.lastSeenRelease' index.html
          grep -F '#btn-cases.has-update::after' index.html
          grep -F '#btn-releases.has-update::after' index.html
          grep -F '## 1.8.0 — 15 September 2026, 10:49 UTC' CHANGELOG.md

      - name: Commit release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md CHANGELOG.md
          git rm .github/scripts/release_system_workflow_18.py .github/workflows/release-system-workflow-18.yml
          git commit -m 'Release Pin It 1.8.0 system workflow'
          git push origin HEAD:main
