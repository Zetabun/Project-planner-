name: Release Pin It 1.9.7 multi-tab hardening

on:
  push:
    paths:
      - '.github/workflows/release-multitab-hardening-197.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hardening fixes
        run: python .github/scripts/release_multitab_hardening_197.py
      - name: Second pass checks
        run: |
          git diff --check
          grep -q 'const VERSION = "1.9.7";' index.html
          grep -q '## 1.9.7 — 15 September 2026, 14:23 UTC' CHANGELOG.md
          ! grep -q 'pinit.tabId.v1' index.html
          grep -q 'sessionStorage.setItem("pinit.tabPrev.v1", TAB_ID)' index.html
          grep -q 'await withCrossTabStorageLock(() => load());' index.html
      - name: Commit release to main
        run: |
          rm -f .github/scripts/release_multitab_hardening_197.py .github/workflows/release-multitab-hardening-197.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Pin It 1.9.7 multi-tab hardening'
          git push origin HEAD:main

# trigger retry
