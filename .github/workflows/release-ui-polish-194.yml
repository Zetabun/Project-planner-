name: Release Pin It 1.9.4 board UI polish

on:
  push:
    paths:
      - '.github/workflows/release-ui-polish-194.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI polish
        run: python3 .github/scripts/release_ui_polish_194.py

      - name: Second pass checks
        run: |
          git diff --check
          grep -F 'const VERSION = "1.9.4";' index.html
          grep -F 'const BUILD = "15 September 2026, 13:54 UTC";' index.html
          grep -F 'let minimapOpen = false, minimapMetrics = null, minimapDragging = false;' index.html
          grep -F 'background-repeat:repeat, no-repeat, no-repeat, no-repeat, no-repeat;' index.html
          grep -F 'margin-left:10px;' index.html
          grep -F '## 1.9.4 — 15 September 2026, 13:54 UTC' CHANGELOG.md

      - name: Commit release to main
        run: |
          rm -f .github/scripts/release_ui_polish_194.py .github/workflows/release-ui-polish-194.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Pin It 1.9.4 board UI polish'
          git push origin HEAD:main
