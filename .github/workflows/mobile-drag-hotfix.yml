name: Mobile drag hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-drag-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and verify
        run: python3 .github/scripts/mobile_drag_hotfix.py

      - name: Commit verified bug fix
        run: |
          rm -f .github/workflows/mobile-drag-hotfix.yml .github/scripts/mobile_drag_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix mobile first-drag for new notes (v1.4.2)"
          git push origin HEAD:main
