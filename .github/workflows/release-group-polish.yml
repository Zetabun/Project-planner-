name: Pin It group and Blueprint polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-group-polish.yml
      - .github/scripts/release_group_polish.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Pin It 1.6.1
        run: python3 .github/scripts/release_group_polish.py

      - name: Second pass checks
        shell: bash
        run: |
          git diff --check
          grep -q 'const VERSION = "1.6.1";' index.html
          grep -q 'const BUILD = "14 September 2026, 23:38 UTC";' index.html
          grep -q 'const labelGap = 18;' index.html
          grep -q 'function syncBlueprintBackdrop()' index.html
          grep -q 'var(--bp-minor,20px)' index.html
          grep -q 'var(--bp-major,100px)' index.html
          grep -q '## 1.6.1 — 14 September 2026, 23:38 UTC' CHANGELOG.md
          grep -q 'grid is anchored to the board itself' README.md
          echo "Second pass: group spacing, Blueprint pan/zoom grid, release metadata and documentation verified."

      - name: Commit release to main
        shell: bash
        run: |
          rm -f .github/workflows/release-group-polish.yml .github/scripts/release_group_polish.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Pin It 1.6.1 group and Blueprint polish"
          git push origin HEAD:main
