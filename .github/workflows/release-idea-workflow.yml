name: Pin It idea workflow release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-idea-workflow.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relax repeated-pattern guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/release_idea_workflow.py')
          s = p.read_text(encoding='utf-8')
          old = '''def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{label}: match not found")\n    return text.replace(old, new, 1)\n'''
          if old not in s:
              raise SystemExit('release verifier helper not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply and verify Pin It 1.5.0
        run: python3 .github/scripts/release_idea_workflow.py

      - name: Second pass checks
        shell: bash
        run: |
          git diff --check
          grep -q 'const VERSION = "1.5.0";' index.html
          grep -q 'id="idea-drawer"' index.html
          grep -q 'function chooseLinkRelationship(from, to)' index.html
          grep -q 'tourStep = clamp(n, 1, 4);' index.html
          grep -q '## 1.5.0 — 14 September 2026, 22:01 UTC' CHANGELOG.md
          echo "Second pass: diff, release metadata, Idea Inbox, onboarding and relationship workflow present."

      - name: Commit release to main
        shell: bash
        run: |
          rm -f .github/workflows/release-idea-workflow.yml .github/scripts/release_idea_workflow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Pin It 1.5.0 idea workflow"
          git push origin HEAD:main
